server {
    listen 80;
    listen [::]:80;
    server_name 121.127.11.237;

    # Root for user app (at /)
    root /var/www/gentrx-user/dist;

    # Patient app at root /
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin app: redirect /admin to /admin/ for consistency
    location = /admin {
        return 301 /admin/;
    }

    # Admin shell entrypoint
    location = /admin/ {
        alias /var/www/gentrx-admin/dist/;
        index index.html;
    }

    # Admin app at /admin/*
    location ^~ /admin/ {
        root /var/www/gentrx-admin/dist;
        index index.html;
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ @admin_spa;
    }

    location @admin_spa {
        root /var/www/gentrx-admin/dist;
        try_files /index.html =404;
    }

    # API proxy to Laravel backend (if needed)
    location /api {
        proxy_pass http://127.0.0.1;
        proxy_set_header Host api-gentrx-dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets cache
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Hide .git and hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
